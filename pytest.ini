[pytest]
testpaths = tests
pythonpath = .

filterwarnings =
    error
    # backoff 2.2.1 calls asyncio.iscoroutinefunction, deprecated in 3.16.
    # Third-party and harmless; scoped tightly so our own warnings still fail.
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:backoff._decorator
